name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: macOS x64 build and the performance spikes.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, clippy, typos, licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - name: Linux GPUI dependencies
        run: ./script/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: crate-ci/typos@v1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - name: Unused dependencies
        run: cargo install cargo-machete --locked && cargo machete

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64; macos-15-intel (x64) runs only on nightly/manual runs.
        # (`matrix` is not available in a job-level `if`, so the filtering happens here.)
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04","windows-2025","macos-15","macos-15-intel"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: ./script/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --workspace --doc

  lsp:
    # Stage 6 DoD: the inner loop against real language servers.
    name: Language servers (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      FERRO_LSP_INSTALL_DIR: ${{ github.workspace }}/.lsp-servers
      FERRO_LSP_REQUIRE: rust-analyzer,basedpyright,vtsls,gopls
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rust-analyzer
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the servers (FerroIDE's installer layout)
        run: |
          mkdir -p "$FERRO_LSP_INSTALL_DIR"
          npm install --prefix "$FERRO_LSP_INSTALL_DIR/vtsls" --no-save @vtsls/language-server typescript
          python -m venv "$FERRO_LSP_INSTALL_DIR/basedpyright/venv"
          "$FERRO_LSP_INSTALL_DIR/basedpyright/venv/bin/pip" install basedpyright
          GOBIN="$FERRO_LSP_INSTALL_DIR/gopls/bin" go install golang.org/x/tools/gopls@latest
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ferro_lsp --test real_servers -- --ignored --test-threads 1

  perf:
    name: Performance spikes (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask spike --seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.os }}
          path: docs/reports/spike-*.json
