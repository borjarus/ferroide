[package]
name = "ferro_workspace"
description = "FerroIDE workspace window: dock, tool windows, editor tabs, toolbar, status bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-rust", "tree-sitter-toml", "tree-sitter-typescript", "tree-sitter-markdown"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
memory-stats = "1"
lsp-types = "0.97"
ferro_ui.workspace = true
ferro_i18n.workspace = true
ferro_keymap.workspace = true
ferro_settings.workspace = true
ferro_services.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
smol.workspace = true

[lints]
workspace = true
