[package]
name = "ferro_lsp"
description = "FerroIDE language server client: JSON-RPC over stdio, server lifecycle and governor, and the LSP-backed LanguageService"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-process fake language server for tests of other crates.
test-support = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-channel.workspace = true
smol.workspace = true
tracing.workspace = true
lsp-types = "0.97"
globset = "0.4"
which = "8"
ferro_services.workspace = true
ferro_languages.workspace = true

[dev-dependencies]
ferro_lsp = { path = ".", features = ["test-support"] }
tempfile = "3"
smol.workspace = true

[lints]
workspace = true
