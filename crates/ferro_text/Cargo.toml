[package]
name = "ferro_text"
description = "FerroIDE editor core without a GUI: rope buffer, transactions, undo/redo, anchors, selections, editing operations, search, display map, encodings and atomic saving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The same rope GPUI Kit's editor stores its text in, so a buffer and the
# editor view share snapshots without copying.
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_chars", "metric_utf16"] }
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
encoding_rs = "0.8"
chardetng = "1"
unicode-bidi = "0.3"
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
