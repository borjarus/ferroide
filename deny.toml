# cargo-deny configuration — see docs/FerroIDE_plan.md §4.3.
# Run with `cargo deny check` (also part of `cargo xtask ci`).

[graph]
all-features = false

[advisories]
# RustSec advisory database.
version = 2
yanked = "deny"
# Flag unmaintained crates only when we depend on them directly. The
# transitive ones all come in through gpui and have no maintained
# replacement we can choose. Vulnerabilities are still checked everywhere.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. GPL/AGPL (e.g. Zed's editor crates) are not allowed.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
