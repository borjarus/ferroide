id = "java"
name = "Java"
file_extensions = ["java"]
project_markers = ["pom.xml", "build.gradle", "build.gradle.kts"]
line_comment = "//"
block_comment = ["/*", "*/"]
indent = { unit = "    ", tab_size = 4 }
decrease_indent_pattern = '^\s*[\}\)\]]'

[grammar]
name = "java"
queries = ["highlights.scm", "tags.scm", "folds.scm", "indents.scm", "runnables.scm"]

[[language_servers]]
id = "jdtls"
command = "jdtls"
install = { github = "eclipse-jdtls/eclipse.jdt.ls" }
features = ["completion", "hover", "definition", "references", "rename", "diagnostics", "formatting"]

[debugger]
adapter = "java-debug"

[[test_frameworks]]
name = "JUnit"
detect = ["pom.xml", "build.gradle", "build.gradle.kts"]
